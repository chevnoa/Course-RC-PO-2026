<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course Bureau Technique</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--brand:#b9396a;--brand-d:#8f2850;--ink:#fff;--card:rgba(255,255,255,.14);--gold:#ffd54a;--silver:#e3e6ea;--bronze:#e39a62}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--brand);color:var(--ink);font-family:Helvetica,Arial,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{width:60px;height:60px;border-radius:50%;flex:none;display:block}
h1{margin:0;font-size:clamp(22px,5vw,34px);line-height:1.1}
h1 small{display:block;font-size:14px;font-weight:400;opacity:.85;margin-top:4px}
.add{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);padding:12px;border-radius:14px;margin-bottom:22px}
.add input{flex:1 1 140px;min-width:0;padding:12px;border:0;border-radius:10px;font-size:16px}
.add button{flex:1 1 100%;padding:13px;border:0;border-radius:10px;background:#fff;color:var(--brand);font-size:17px;font-weight:700;cursor:pointer}
.add button:active{transform:scale(.98)}
#msg{flex:1 1 100%;font-size:14px;min-height:18px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:22px}
.pl{text-align:center;position:relative}
.pl .who{font-weight:700;font-size:clamp(14px,3.6vw,22px);word-break:break-word;padding:0 2px}
.pl .t{font-size:clamp(13px,3.2vw,20px);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.pl .blk{display:grid;place-items:center;font-size:clamp(34px,9vw,56px);font-weight:800;color:var(--brand-d);border-radius:12px 12px 0 0}
.pl.p1 .blk{height:130px;background:var(--gold)}
.pl.p2 .blk{height:96px;background:var(--silver)}
.pl.p3 .blk{height:72px;background:var(--bronze)}
.pl.empty{opacity:.35}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:12px;background:var(--card);padding:10px 14px;border-radius:10px;font-size:18px}
li .n{width:28px;font-weight:800;opacity:.9}
li .w{flex:1;min-width:0;overflow-wrap:anywhere}
li .t{font-variant-numeric:tabular-nums;font-weight:700}
.x{border:0;background:transparent;color:#fff;opacity:.6;font-size:16px;cursor:pointer;padding:2px 6px}
.acts{display:inline-flex;gap:2px}
.x svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl .acts{justify-content:center;margin-top:4px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov.on{display:flex}
#ov .box{background:#fff;color:#222;border-radius:14px;padding:18px;width:100%;max-width:360px;display:grid;gap:10px}
#ov h3{margin:0;color:var(--brand)}
#ov input{padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;min-width:0}
#ov .row{display:flex;gap:8px}
#ov button{flex:1;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#ov .ok{background:var(--brand);color:#fff}
#ov .no{background:#eee;color:#444}
#emsg{color:#b00;font-size:14px;min-height:16px}
.empty-note{opacity:.8;text-align:center;padding:10px}
h2{font-size:16px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin:0 0 8px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>.lnk{background:none;border:0;color:#fff;opacity:.6;text-decoration:underline;cursor:pointer;font-size:13px}#login{display:none;margin-top:10px}</style>

<div id="ov"><div class="box">
  <h3>Modifier le temps</h3>
  <input id="epseudo" placeholder="Pseudo" maxlength="20" autocomplete="off">
  <input id="etime" placeholder="Temps (ex. 12.34)" inputmode="decimal" autocomplete="off">
  <div id="emsg"></div>
  <div class="row"><button class="no" id="ecancel">Annuler</button><button class="ok" id="esave">Enregistrer</button></div>
</div></div>
<script>
let entries = [], canWrite = false, col = null, editId = null;
const $ = id => document.getElementById(id);

function fmt(ms){
  const m = Math.floor(ms/60000), s = (ms%60000)/1000;
  return m + ':' + s.toFixed(2).padStart(5,'0');
}
function parse(v){
  const r = v.trim().replace(',', '.').match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  if(!r) return null;
  const ms = Math.round(((+r[1]||0)*60 + parseFloat(r[2]))*1000);
  return ms > 0 ? ms : null;
}
function say(t){ $('msg').textContent = t; }

function del(id){
  if(!col) return;
  col.child(id).remove().catch(()=>say('Suppression impossible.'));
}
function openEdit(id){
  const e = entries.find(x=>x.id===id); if(!e) return;
  editId = id;
  $('epseudo').value = e.pseudo; $('etime').value = fmt(e.ms); $('emsg').textContent='';
  $('ov').classList.add('on'); $('epseudo').focus();
}
function closeEdit(){ $('ov').classList.remove('on'); editId = null; }
async function saveEdit(){
  const pseudo = $('epseudo').value.trim(), ms = parse($('etime').value);
  if(!pseudo) return $('emsg').textContent='Entre un pseudo.';
  if(!ms) return $('emsg').textContent='Temps invalide (ex. 12.34 ou 1:05.20).';
  try{ await col.child(editId).update({pseudo, ms}); closeEdit(); }
  catch(e){ $('emsg').textContent='Modification impossible.'; }
}
$('ecancel').onclick = closeEdit;
$('esave').onclick = saveEdit;
$('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeEdit(); });
['epseudo','etime'].forEach(i=>$(i).addEventListener('keydown',e=>{ if(e.key==='Enter') saveEdit(); }));
function xBtn(id){
  if(!canWrite) return null;
  const w = document.createElement('span'); w.className='acts';
  const p = document.createElement('button');
  p.className='x'; p.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg>'; p.title='Modifier';
  p.onclick = () => openEdit(id);
  const b = document.createElement('button');
  b.className='x'; b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'; b.title='Supprimer';
  b.onclick = () => del(id);
  w.append(p,b);
  return w;
}

function render(){
  const top = [...entries].sort((a,b)=>a.ms-b.ms).slice(0,10);
  const pod = $('podium'); pod.innerHTML='';
  [1,0,2].forEach(i=>{
    const e = top[i], d = document.createElement('div');
    d.className = 'pl p'+(i+1) + (e?'':' empty');
    const w = document.createElement('div'); w.className='who'; w.textContent = e ? e.pseudo : '—';
    const t = document.createElement('div'); t.className='t'; t.textContent = e ? fmt(e.ms) : '';
    const b = document.createElement('div'); b.className='blk'; b.textContent = i+1;
    d.append(w,t,b);
    if(e){ const x = xBtn(e.id); if(x) d.append(x); }
    pod.append(d);
  });
  const ol = $('list'); ol.innerHTML='';
  const rest = top.slice(3);
  if(!top.length){
    ol.innerHTML = '<div class="empty-note">Aucun temps pour l’instant. À vous de jouer !</div>';
  }
  rest.forEach((e,k)=>{
    const li = document.createElement('li');
    const n = document.createElement('span'); n.className='n'; n.textContent = (k+4)+'.';
    const w = document.createElement('span'); w.className='w'; w.textContent = e.pseudo;
    const t = document.createElement('span'); t.className='t'; t.textContent = fmt(e.ms);
    li.append(n,w,t);
    const x = xBtn(e.id); if(x) li.append(x);
    ol.append(li);
  });
}

async function add(){
  const pseudo = $('pseudo').value.trim(), ms = parse($('time').value);
  if(!pseudo) return say('Entre un pseudo.');
  if(!ms) return say('Temps invalide (ex. 12.34 ou 1:05.20).');
  if(!col) return say('Base de données indisponible.');
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  try{
    await col.child(id).set({pseudo, ms, at: Date.now()});
    $('time').value=''; $('pseudo').value=''; $('pseudo').focus(); say('Ajouté ✔');
    setTimeout(()=>say(''),2000);
  }catch(e){ say('Écriture refusée (réservé à l’organisateur).'); }
}
$('btn').onclick = add;
['pseudo','time'].forEach(i=>$(i).addEventListener('keydown',e=>{ if(e.key==='Enter') add(); }));
render();
